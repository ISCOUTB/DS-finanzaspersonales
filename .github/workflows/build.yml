name: Build and SonarQube Analysis

on:
  push:
    branches:
      - master
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  sonarqube:
    name: SonarQube Analysis
    runs-on: windows-latest
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      SONAR_HOST_URL: 'https://sonarcloud.io'
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Evita clones superficiales para un mejor análisis

      # Cache para Flutter en Windows
      - name: Cache Flutter dependencies
        uses: actions/cache@v3
        with:
          path: |
            ${{ runner.tool_cache }}/flutter
            ${{ env.LOCALAPPDATA }}\Pub\Cache
          key: ${{ runner.os }}-flutter-${{ hashFiles('**/pubspec.yaml') }}
          restore-keys: |
            ${{ runner.os }}-flutter-

      - name: Set up Java 17
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle' # Solo usa el cache automático de Gradle

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.29.2'

      - name: Verify Flutter installation
        run: flutter doctor

      - name: Install dependencies
        run: flutter pub get

      - name: Build WEB
        run: flutter build web

      # Ejecutar tests con coverage
      - name: Run tests with coverage
        run: |
          flutter test --coverage
          echo "Coverage file generated:"
          dir coverage
          if exist coverage\lcov.info (
            echo "LCOV file exists and has size:"
            dir coverage\lcov.info
            echo "First 20 lines of lcov.info:"
            powershell "Get-Content coverage\lcov.info | Select-Object -First 20"
          ) else (
            echo "ERROR: lcov.info file not found!"
            exit 1
          )

      # Convertir paths en lcov.info para Windows (fix paths)
      - name: Fix LCOV paths for Windows
        run: |
          powershell -Command "(Get-Content coverage\lcov.info) -replace '\\/', '\' | Set-Content coverage\lcov.info"
          echo "LCOV paths fixed for Windows"

      # Debug para verificar archivos
      - name: Debug coverage files
        run: |
          echo "Current directory:"
          dir
          echo "Coverage directory:"
          dir coverage
          echo "Coverage file content (first 10 lines after fix):"
          powershell "Get-Content coverage\lcov.info | Select-Object -First 10"

      - name: Install SonarQube Build Wrapper
        uses: SonarSource/sonarqube-scan-action/install-build-wrapper@v5

      - name: Run SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@v5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: 'https://sonarcloud.io'
        with:
          args: >
            -Dsonar.sources=lib
            -Dsonar.tests=test
            -Dsonar.dart.coverage.reportPaths=coverage/lcov.info
            -Dsonar.coverage.exclusions=**/*.g.dart,**/*.freezed.dart,**/*.config.dart
            -Dsonar.test.exclusions=**/*.g.dart,**/*.freezed.dart,**/*.config.dart
            -Dsonar.verbose=true
            -Dsonar.qualitygate.wait=false