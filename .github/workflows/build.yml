name: Build and Analyze

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  analyze:
    name: Analyze with SonarCloud
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.0' 

      - name: Install dependencies
        run: flutter pub get

      - name: Run tests with coverage
        run: |
          flutter test --coverage
          genhtml coverage/lcov.info -o coverage/html

      - name: Download Dart Sonar Analyzer
        run: |
          mkdir -p .dart-sonar
          curl -sL https://github.com/insideapp-oss/sonar-dart/releases/latest/download/dart-sonar-linux -o .dart-sonar/dart-sonar
          chmod +x .dart-sonar/dart-sonar

      - name: Run SonarCloud Analysis
        run: |
          .dart-sonar/dart-sonar analyze \
            --source lib \
            --coverage coverage/lcov.info \
            --project-key ISCOUTB_DS-finanzaspersonales \
            --organization isco-utb \
            --token $SONAR_TOKEN
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
