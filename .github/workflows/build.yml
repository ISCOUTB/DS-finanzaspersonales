name: Build and SonarQube Analysis

on:
  push:
    branches:
      - master
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  sonarqube:
    name: SonarQube Analysis
    runs-on: windows-latest
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      SONAR_HOST_URL: 'https://sonarcloud.io'
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Evita clones superficiales para un mejor análisis

      # Cache para Flutter en Windows
      - name: Cache Flutter dependencies
        uses: actions/cache@v3
        with:
          path: |
            ${{ runner.tool_cache }}/flutter
            ${{ env.LOCALAPPDATA }}\Pub\Cache
          key: ${{ runner.os }}-flutter-${{ hashFiles('**/pubspec.yaml') }}
          restore-keys: |
            ${{ runner.os }}-flutter-

      - name: Set up Java 17
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.29.2'

      - name: Verify Flutter installation
        run: flutter doctor

      - name: Install dependencies
        run: flutter pub get

      - name: Build WEB
        run: flutter build web

      # Ejecutar tests con coverage
      - name: Run tests with coverage
        run: |
          flutter test --coverage
          Write-Host "Coverage generated, checking file..."
          if (Test-Path "coverage\lcov.info") {
            Write-Host "LCOV file found, size:"
            Get-ChildItem "coverage\lcov.info"
            Write-Host "Sample content:"
            Get-Content "coverage\lcov.info" | Select-Object -First 5
          } else {
            Write-Host "ERROR: No coverage file generated!"
            exit 1
          }

      # FIX CRÍTICO: Convertir paths absolutos en lcov.info
      - name: Fix LCOV file paths for SonarCloud
        run: |
          $content = Get-Content "coverage\lcov.info"
          $fixed = $content | ForEach-Object {
            if ($_ -match '^SF:') {
              # Extraer solo el nombre del archivo relativo desde lib/
              $path = $_ -replace '^SF:', ''
              if ($path -match '.*\\lib\\(.*)') {
                'SF:lib/' + $matches[1].Replace('\', '/')
              } elseif ($path -match '.*\\test\\(.*)') {
                'SF:test/' + $matches[1].Replace('\', '/')  
              } else {
                $_
              }
            } else {
              $_
            }
          }
          $fixed | Set-Content "coverage\lcov.info"
          Write-Host "LCOV paths fixed. New content sample:"
          Get-Content "coverage\lcov.info" | Select-Object -First 10

      # Verificar formato final
      - name: Verify LCOV format
        run: |
          Write-Host "Final LCOV content check:"
          $content = Get-Content "coverage\lcov.info"
          $sfLines = $content | Where-Object { $_ -match '^SF:' } | Select-Object -First 5
          Write-Host "SF lines found:"
          $sfLines | ForEach-Object { Write-Host $_ }
          
          $daLines = $content | Where-Object { $_ -match '^DA:' } | Select-Object -First 5  
          Write-Host "DA lines found:"
          $daLines | ForEach-Object { Write-Host $_ }

      - name: Install SonarQube Build Wrapper
        uses: SonarSource/sonarqube-scan-action/install-build-wrapper@v5

      - name: Run SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@v5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: 'https://sonarcloud.io'
        with:
          args: >
            -Dsonar.sources=lib
            -Dsonar.tests=test
            -Dsonar.coverageReportPaths=coverage/lcov.info
            -Dsonar.dart.lcov.reportPaths=coverage/lcov.info
            -Dsonar.javascript.lcov.reportPaths=coverage/lcov.info
            -Dsonar.verbose=true
            -Dsonar.qualitygate.wait=false